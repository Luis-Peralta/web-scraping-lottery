name: Pipeline github
run-name: ${{ github.actor }} is executing the pipeline...

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:  

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALL_DATA: ${{ vars.ALL_DATA }}
      COLLECTION: ${{ vars.COLLECTION }}
      DB_NAME: ${{ vars.DB_NAME }}
      SAVE_DATA: ${{ vars.SAVE_DATA }}
      URL: ${{ vars.URL }}
      SEND_AI_ANALYSIS: ${{ vars.SEND_AI_ANALYSIS }}
    steps:
      - uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm i
      - name: Install Puppeteer system dependencies
        run: bash script/install-deps.sh
      - name: Verify eslint
        run: npm run eslint
      - name: Run scraping (extract lottery data)
        id: scrape
        continue-on-error: true   # we still want to attempt notifications + capture artifacts
        run: npm run data
      - name: Send notifications (lucky numbers / AI analysis)
        # Run notifications even if scraping had issues (it may have saved partial data)
        if: always()
        run: npm run lucky
      - name: Upload debug artifacts (screenshots, etc) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: puppeteer-debug-${{ github.run_id }}
          path: |
            puppeteer-debug-*.png
            *.log
          retention-days: 7
          if-no-files-found: warn
